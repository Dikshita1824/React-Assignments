name: Deploy React Assignments

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            react1/package-lock.json
            react2/package-lock.json
            react3/package-lock.json
            Assignment4/package-lock.json

      - name: Build React Assignments
        shell: bash
        run: |
          set -e

          mkdir -p site

          for project in react1 react2 react3 Assignment4
          do
            echo "=============================="
            echo "Building $project"
            echo "=============================="

            cd "$GITHUB_WORKSPACE/$project"

            npm ci
            npm run build -- --base="/React-Assignments/$project/"

            mkdir -p "$GITHUB_WORKSPACE/site/$project"
            cp -r dist/. "$GITHUB_WORKSPACE/site/$project/"
          done

      - name: Create Home Page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>React Assignments</title>
          </head>
          <body>
            <h1>React Assignments</h1>

            <ul>
              <li>
                <a href="./react1/">React Assignment 1</a>
              </li>

              <li>
                <a href="./react2/">React Assignment 2</a>
              </li>

              <li>
                <a href="./react3/">React Assignment 3</a>
              </li>

              <li>
                <a href="./Assignment4/">React Assignment 4</a>
              </li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
